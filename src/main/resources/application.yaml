spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: espresso-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:espresso}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-} trace_id=%X{trace_id:-} span_id=%X{span_id:-}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
          #

environment:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://espresso-application-otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_SERVICE_NAME: espresso-api
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production

